<!-- Saugroboter – Kachel für die Kachel-Visualisierung (HTML-SDK).
     Das Modul schickt ein Datenpaket {view, map}; gezeichnet wird hier.
     Bedienung läuft über requestAction(Ident, Wert) zurück an das Modul. -->
<style>/*STYLE*/</style>
<div id="bg"></div>
<div id="app"></div>
<script>
(function () {
  var view = null, map = '', mapLast = '', showLast = false, dialog = null, busy = {}, open = { wear: false, hist: false }, lastToast = null;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function act(ident, value, key) {
    busy[key || ident] = Date.now();
    render();
    requestAction(ident, value);
  }
  function isBusy(key) { return busy[key] && Date.now() - busy[key] < 8000; }

  // ---- Symbole (eigene, schlichte Linienzeichnungen) ----
  var P = {
    play: '<path d="M8 5.5v13l10.5-6.5z" fill="currentColor" stroke="none"/>',
    pause: '<rect x="7" y="5.5" width="3.5" height="13" rx="1" fill="currentColor" stroke="none"/><rect x="13.5" y="5.5" width="3.5" height="13" rx="1" fill="currentColor" stroke="none"/>',
    stop: '<rect x="6.5" y="6.5" width="11" height="11" rx="2.5" fill="currentColor" stroke="none"/>',
    home: '<path d="M4 11.5 12 5l8 6.5"/><path d="M6.5 10v8.5h11V10"/><path d="M10 18.5v-4.5h4v4.5"/>',
    locate: '<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><circle cx="12" cy="12" r="7.5"/>',
    drop: '<path d="M12 3.5c3 3.9 5.5 7 5.5 10a5.5 5.5 0 0 1-11 0c0-3 2.5-6.1 5.5-10z"/>',
    dirty: '<path d="M12 3.5c3 3.9 5.5 7 5.5 10a5.5 5.5 0 0 1-11 0c0-3 2.5-6.1 5.5-10z"/><path d="M9.5 14.5c.8.9 1.6 1.3 2.5 1.3s1.7-.4 2.5-1.3"/>',
    bag: '<path d="M6 8.5h12l-1 11H7z"/><path d="M9 8.5V7a3 3 0 0 1 6 0v1.5"/>',
    wash: '<path d="M5 15.5c2 0 2-1.5 3.5-1.5s1.5 1.5 3.5 1.5 2-1.5 3.5-1.5 1.5 1.5 3.5 1.5"/><path d="M5 19c2 0 2-1.5 3.5-1.5S10 19 12 19s2-1.5 3.5-1.5S17 19 19 19"/><path d="M12 4v6M9.5 7.5 12 10l2.5-2.5"/>',
    dry: '<circle cx="12" cy="12" r="2"/><path d="M12 10c0-3 1-5.5 3.5-5.5M14 12c3 0 5.5 1 5.5 3.5M12 14c0 3-1 5.5-3.5 5.5M10 12c-3 0-5.5-1-5.5-3.5"/>',
    empty: '<path d="M8 4.5h8M9 4.5v3.5L6.5 11v8.5h11V11L15 8V4.5"/><path d="M12 12.5v4M10 14.5l2 2 2-2"/>',
    check: '<path d="m6 12.5 4 4 8-9"/>',
    bolt: '<path d="M13 3 6 13.5h5L10.5 21 18 10h-5z" fill="currentColor" stroke="none"/>',
    wrench: '<path d="M14.5 5.5a4 4 0 0 0-5 5L4.5 15.5a1.8 1.8 0 0 0 2.5 2.5l5-5a4 4 0 0 0 5-5l-2.5 2.5-2-2z"/>',
    reset: '<path d="M5 12a7 7 0 1 0 2-4.9"/><path d="M5 4.5V8h3.5"/>',
    auto: '<path d="M12 21s6.5-5.5 6.5-11a6.5 6.5 0 0 0-13 0c0 5.5 6.5 11 6.5 11z"/><circle cx="12" cy="10" r="2.3"/>',
    alert: '<path d="M12 4 2.8 19.5h18.4z"/><path d="M12 10v4.5M12 17v.2"/>',
    close: '<path d="m7 7 10 10M17 7 7 17"/>',
    tune: '<path d="M5 7h9M18 7h1M5 17h1M10 17h9"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',
    moon: '<path d="M19 14.5A7.5 7.5 0 1 1 9.5 5a6 6 0 0 0 9.5 9.5z"/>',
    spark: '<path d="M12 3.5 13.8 9l5.7 1.9-5.7 1.9L12 18.5l-1.8-5.7-5.7-1.9L10.2 9z"/><path d="M18.5 4v3M17 5.5h3"/>',
    fan: '<circle cx="12" cy="12" r="8"/><path d="M12 12c0-2.5 1-4.5 3-5M12 12c2.5 0 4.5 1 5 3M12 12c0 2.5-1 4.5-3 5M12 12c-2.5 0-4.5-1-5-3"/>',
    layers: '<path d="M12 4 3.5 8.5 12 13l8.5-4.5z"/><path d="M3.5 12.5 12 17l8.5-4.5"/>',
    list: '<path d="M9 7h10M9 12h10M9 17h10"/><circle cx="5" cy="7" r=".6"/><circle cx="5" cy="12" r=".6"/><circle cx="5" cy="17" r=".6"/>'
  };
  // Eigene Draufsicht eines runden Saugroboters mit LiDAR-Turm (zeigt nach rechts = Fahrtrichtung)
  function robotSvg(cls) {
    return '<svg class="' + cls + '" viewBox="0 0 48 48" aria-hidden="true">' +
      '<circle cx="24" cy="24" r="21.5" fill="#f6f7f9" stroke="#cfd5dd" stroke-width="1"/>' +
      '<path d="M33.5 7.8A21.5 21.5 0 0 1 33.5 40.2" fill="none" stroke="#9aa3af" stroke-width="3.2" stroke-linecap="round"/>' +
      '<circle cx="24" cy="24" r="15.5" fill="none" stroke="#e3e7ec" stroke-width="1"/>' +
      '<circle cx="20" cy="24" r="7.2" fill="#2a3039"/><circle cx="20" cy="24" r="4.3" fill="none" stroke="#56606d" stroke-width="1.2"/>' +
      '<circle cx="20" cy="24" r="1.6" fill="#7aa9ff"/>' +
      '<rect x="31" y="21.6" width="3" height="4.8" rx="1.5" fill="#4c8dff"/></svg>';
  }
  function dockSvg() {
    return '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="6.5" fill="#34c77b" stroke="#fff" stroke-width="2"/>' +
      '<path d="M13 5.5 8 13h3.4l-.9 5.5L16 11h-3.5z" fill="#fff"/></svg>';
  }
  var lastRobot = null;   // letzte gezeichnete Position -> gleitende Bewegung

  function ic(n, cls) {
    return '<svg class="ic' + (cls ? ' ' + cls : '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + P[n] + '</svg>';
  }

  // ---- Kopf ----
  function battery(v, charging) {
    var p = Math.max(0, Math.min(100, v));
    var cls = p <= 20 ? 'bad' : (charging ? 'acc' : 'ok');
    return '<div class="batt ' + cls + '" title="Akku"><span class="cell"><i style="width:' + p + '%"></i></span>' +
      (charging ? ic('bolt', 'xs') : '') + '<b>' + p + ' %</b></div>';
  }
  function statusTone(v) {
    if (!v.online) return 'off';
    if (v.error && !v.warning) return 'bad';
    if (v.group === 'working' || v.group === 'moving') return 'work';
    if (v.group === 'paused') return 'warn';
    return 'ok';
  }

  // Karte mit Raumnamen; Antippen eines Raums öffnet die Nachfrage (nur Live-Ansicht)
  function mapBlock(v) {
    var last = showLast && mapLast;
    var src = last ? mapLast : map, meta = last ? v.lastMeta : v.mapMeta;
    var h = '<div class="card mapcard">';
    // schwebende Umschalter über der Karte
    var top = '';
    if (v.floors.length > 1 && !last) {
      top += '<div class="seg">';
      v.floors.forEach(function (f) {
        top += '<button class="' + (f.id === v.floor ? 'on' : '') + '" data-floor="' + f.id + '">' + esc(f.name) + '</button>';
      });
      top += '</div>';
    } else top += '<span></span>';
    if (mapLast) {
      top += '<div class="seg"><button class="' + (last ? '' : 'on') + '" data-view="live">Live</button>' +
        '<button class="' + (last ? 'on' : '') + '" data-view="last">Letzte</button></div>';
    }
    h += '<div class="maptop">' + top + '</div>';
    if (!src) return h + '<div class="empty">' + ic('list') + '<div>Noch keine Karte</div><div class="small mute">In der Instanz „Karten &amp; Räume einlesen“.</div></div></div>';
    var sel = {};
    v.rooms.forEach(function (r) { sel[r.code] = r.sel; });
    h += '<div class="mapbox"><div class="mapwrap' + (last ? '' : ' pick') + '"><img id="mapimg" src="' + src + '" alt="Karte">';
    if (meta && meta.rooms) {
      Object.keys(meta.rooms).forEach(function (seg) {
        var code = meta.mapId * 100 + parseInt(seg, 10), name = v.roomNames[code];
        if (!name) return;
        var p = meta.rooms[seg];
        h += '<span class="lbl' + (!last && sel[code] ? ' on' : '') + '" style="left:' + (p[0] * 100) + '%;top:' + (p[1] * 100) + '%">' +
          (!last && sel[code] ? ic('check', 'xs') : '') + esc(name) + '</span>';
      });
    }
    var ov = last ? v.overlayLast : v.overlay;
    if (ov && meta && meta.dock) h += '<span class="dock" style="left:' + (meta.dock[0] * 100) + '%;top:' + (meta.dock[1] * 100) + '%">' + dockSvg() + '</span>';
    if (ov && meta && meta.robot && !last) {
      var tgt = { x: meta.robot[0] * 100, y: meta.robot[1] * 100, a: meta.robot[2] };
      var from = lastRobot && lastRobot.map === meta.mapId ? lastRobot : tgt;
      // kürzester Drehweg (359° -> 1° dreht 2°, nicht 358°)
      if (lastRobot) { var da = ((tgt.a - from.a) % 360 + 540) % 360 - 180; tgt.a = from.a + da; }
      h += '<span class="robot' + (v.group === 'working' || v.group === 'moving' ? ' busy' : '') + '" id="robot" data-x="' + tgt.x + '" data-y="' + tgt.y + '" data-a="' + tgt.a +
        '" style="left:' + from.x + '%;top:' + from.y + '%;transform:translate(-50%,-50%) rotate(' + from.a + 'deg)">' + robotSvg('rb') + '</span>';
      lastRobot = { x: tgt.x, y: tgt.y, a: tgt.a, map: meta.mapId };
    }
    h += '</div></div>';
    var hint = '';
    if (last && v.lastRun) hint = esc(v.lastRun);
    else if (v.rooms.length && meta) hint = 'Raum antippen, um ihn zu reinigen';
    else if (v.rooms.length) hint = 'Karte wird vorbereitet …';
    if (hint) h += '<div class="maphint">' + hint + '</div>';
    return h + '</div>';
  }

  // Raumnamen lesbar platzieren: am Rand nach innen schieben, Überlappungen nach unten auflösen
  function placeLabels() {
    var wrap = document.querySelector('.mapwrap');
    if (!wrap) return;
    var wr = wrap.getBoundingClientRect();
    if (!wr.width) return;
    var placed = [];
    Array.prototype.forEach.call(wrap.querySelectorAll('.lbl'), function (l) {
      l.style.marginLeft = ''; l.style.marginTop = '';
      var r = l.getBoundingClientRect(), dx = 0, dy = 0;
      if (r.right > wr.right - 2) dx = wr.right - 2 - r.right;
      if (r.left + dx < wr.left + 2) dx = wr.left + 2 - r.left;
      for (var i = 0; i < 6; i++) {
        var hit = placed.filter(function (q) {
          return r.left + dx < q.right && r.right + dx > q.left && r.top + dy < q.bottom && r.bottom + dy > q.top;
        })[0];
        if (!hit) break;
        dy = hit.bottom - r.top + 2;
      }
      if (r.bottom + dy > wr.bottom - 2) dy = Math.min(dy, wr.bottom - 2 - r.bottom);
      if (dx) l.style.marginLeft = dx + 'px';
      if (dy) l.style.marginTop = dy + 'px';
      placed.push({ left: r.left + dx, right: r.right + dx, top: r.top + dy, bottom: r.bottom + dy });
    });
  }

  // Tippposition -> Raumcode (Drehung der Karte rückgängig machen, dann im Raster nachsehen)
  function roomAt(ev, meta) {
    var img = document.getElementById('mapimg');
    if (!img || !meta || !meta.grid) return 0;
    var r = img.getBoundingClientRect();
    var u = (ev.clientX - r.left) / r.width, w = (ev.clientY - r.top) / r.height, fx = u, fy = w;
    if (meta.rot === 90) { fx = w; fy = 1 - u; }
    else if (meta.rot === 180) { fx = 1 - u; fy = 1 - w; }
    else if (meta.rot === 270) { fx = 1 - w; fy = u; }
    if (fx < 0 || fy < 0 || fx >= 1 || fy >= 1) return 0;
    var ch = meta.grid.charAt(Math.floor(fy * meta.gh) * meta.gw + Math.floor(fx * meta.gw));
    return ch === '.' || ch === '' ? 0 : meta.mapId * 100 + (ch.charCodeAt(0) - 48);
  }

  // Einstellungen als Segmentschalter (Kurzformen, damit es auf schmalen Kacheln passt)
  var SHORT = { 'wie am Gerät': 'Gerät', 'Saugen und wischen': 'Beides', 'Erst saugen, dann wischen': 'Nacheinander',
    'Leicht feucht': 'Leicht', 'Tiefenreinigung': 'Tief' };
  function segSet(k, p, cur, attr) {
    var h = '<div class="seg full">';
    p.o.forEach(function (o) {
      var t = SHORT[o[1]] || o[1];
      h += '<button class="' + (o[0] === cur ? 'on' : '') + '" ' + attr + '="' + k + '" data-val="' + o[0] + '" title="' + esc(o[1]) + '">' + esc(t) + '</button>';
    });
    return h + '</div>';
  }

  // Nachfrage nach dem Antippen eines Raums: wie soll gereinigt werden?
  var DAYS = { 0: 'täglich', 1: 'Montag', 2: 'Dienstag', 3: 'Mittwoch', 4: 'Donnerstag', 5: 'Freitag', 6: 'Samstag', 7: 'Sonntag', 8: 'Mo–Fr', 9: 'Sa + So' };
  function planRoomNames(v, row) {
    return v.planRooms.filter(function (r) { return row['r' + r.code]; }).map(function (r) { return r.name; });
  }
  // Kurzfassung beliebiger Einstellungen, z. B. "Saugen · Turbo · 2×"
  function setSummary(v, set) {
    var out = [];
    ['Mode', 'Suction', 'Wetness', 'Passes', 'CleanGenius'].forEach(function (k) {
      var val = set[k], p = v.presets[k];
      if (val === undefined || val === -1 || (k === 'Passes' && val === 1)) return;
      if (k === 'Wetness' && set.Mode === 0) return;
      if (k === 'Suction' && set.Mode === 1) return;
      p.o.forEach(function (o) { if (o[0] === val) out.push(k === 'CleanGenius' ? 'CleanGenius ' + (SHORT[o[1]] || o[1]) : (SHORT[o[1]] || o[1])); });
    });
    return out.length ? out.join(' · ') : 'wie am Gerät';
  }
  // Raumplan in einer Zeile ("Mo–Fr: Küche, So: frei" bzw. "jeden Tag gleich")
  function planShort(v) {
    if (!v.plan.length) return 'jeden Tag gleich';
    var short = { 0: 'Tägl.', 1: 'Mo', 2: 'Di', 3: 'Mi', 4: 'Do', 5: 'Fr', 6: 'Sa', 7: 'So', 8: 'Mo–Fr', 9: 'Sa+So' };
    return v.plan.map(function (row) {
      var rooms = planRoomNames(v, row);
      var t = v.autoMode === 1 && !row.off ? ' ' + (row.time || v.autoTime) : '';
      return short[row.day] + t + ': ' + (row.off ? 'frei' : (rooms.length ? rooms.join(', ') : 'alles'));
    }).join(' · ');
  }
  // Programm wählen (Untermenü); mode 'progsel' = zum Reinigen, 'autoprog' = für die Automatik
  function progDialog(v, d) {
    var cur = d.mode === 'autoprog' ? v.autoProgram : v.cleanProgram;
    var h = '<div class="dlg-head"><div><div class="dlg-title">' + (d.mode === 'autoprog' ? 'Programm der Automatik' : 'Programm') + '</div><div class="small mute">' +
      (d.mode === 'autoprog' ? 'So reinigt die Automatik (im Raumplan je Tag änderbar).' : 'Gilt für den Startknopf – für die ausgewählten Räume oder alles.') + '</div></div>' +
      '<button class="iconbtn" data-dlg="close" aria-label="Schließen">' + ic('close') + '</button></div><div class="plist">';
    v.programs.forEach(function (p) {
      h += '<div class="pitem' + (p.id === cur ? ' on' : '') + '"><button class="pmain" data-pick="' + p.id + '">' + ic(PICON[p.id] || 'tune') +
        '<span class="grow"><b>' + esc(p.name) + '</b><span class="small mute">' + esc(setSummary(v, p.set)) + '</span></span>' + (p.id === cur ? ic('check') : '') + '</button>' +
        (p.custom ? '<button class="iconbtn sm" data-open="presets" title="Eigene Einstellungen anpassen">' + ic('tune') + '</button>' : '') + '</div>';
    });
    return h + '</div>';
  }

  // Raumplan als kurze Liste in der Automatik-Karte
  function planSummary(v) {
    var h = '<button class="setrow plan" data-open="plan">' + ic('list', 'lead') + '<span class="grow"><span class="small mute">Raumplan</span>';
    if (!v.plan.length) h += '<br>kein Plan – jeden Tag gleich';
    v.plan.forEach(function (row) {
      var rooms = planRoomNames(v, row);
      h += '<span class="pline"><b>' + esc(DAYS[row.day] || '?') + '</b> ' + (row.off ? 'frei' : esc(rooms.length ? rooms.join(', ') : 'alles') +
        ' · ' + esc(row.prog >= 0 ? v.programNames[row.prog] : 'Standard')) + '</span>';
    });
    return h + '</span><span class="chev r"></span></button>';
  }
  // Raumplan bearbeiten
  function planDialog(v, d) {
    var h = '<div class="dlg-head"><div><div class="dlg-title">Zeitpläne</div><div class="small mute">' +
      (v.autoMode === 1 ? 'Jeder Eintrag startet zu seiner Uhrzeit (leer = ' + esc(v.autoTime) + ' Uhr). Mehrere Einträge pro Tag sind möglich.' : 'Bei Abwesenheit zählen Tag, Räume und Programm (Uhrzeit nur bei „Zur Uhrzeit“).') + '</div></div>' +
      '<button class="iconbtn" data-dlg="close" aria-label="Schließen">' + ic('close') + '</button></div>';
    if (!d.rows.length) h += '<div class="small mute" style="margin-bottom:10px">Noch kein Eintrag – dann gilt täglich die Standard-Uhrzeit mit dem Standard-Programm.</div>';
    d.rows.forEach(function (row, i) {
      h += '<div class="prow"><div class="prow-top"><select data-pday="' + i + '">';
      Object.keys(DAYS).forEach(function (k) { h += '<option value="' + k + '"' + (parseInt(k, 10) === row.day ? ' selected' : '') + '>' + DAYS[k] + '</option>'; });
      h += '</select><input class="ptime" type="time" data-ptime="' + i + '" value="' + esc(row.time || '') + '" title="Uhrzeit (leer = Standard)"' + (row.off ? ' disabled' : '') + '>' +
        '<button class="iconbtn sm" data-pdel="' + i + '" title="Eintrag löschen">' + ic('close') + '</button></div>' +
        '<select class="pprog" data-pprog="' + i + '"' + (row.off ? ' disabled' : '') + '><option value="-1">Programm: Standard</option>';
      Object.keys(v.programNames).forEach(function (k) { h += '<option value="' + k + '"' + (parseInt(k, 10) === row.prog ? ' selected' : '') + '>' + esc(v.programNames[k]) + '</option>'; });
      h += '</select><div class="chips">';
      v.planRooms.forEach(function (r) {
        var on = !row.off && row['r' + r.code];
        h += '<button class="chip' + (on ? ' on' : '') + (row.off ? ' dim' : '') + '" data-proom="' + i + ':' + r.code + '">' + (on ? ic('check', 'xs') : '') + esc(r.name) + '</button>';
      });
      h += '<button class="chip' + (row.off ? ' on off' : '') + '" data-poff="' + i + '">frei</button></div>' +
        '<div class="small mute">' + (row.off ? 'An diesem Tag keine Automatik-Reinigung' : (planRoomNames(v, row).length ? '' : 'Nichts angehakt = alles')) + '</div></div>';
    });
    h += '<div class="dlg-actions"><button class="btn ghost" data-padd="1">+ Eintrag hinzufügen</button>' +
      '<button class="btn main" data-psave="1">' + ic('check') + 'Speichern</button></div>';
    return h;
  }
  var PICON = { 0: 'tune', 1: 'bolt', 2: 'fan', 3: 'drop', 4: 'layers', 5: 'wash', 6: 'moon', 7: 'spark', 8: 'spark' };
  var DLG = [['Mode', 'Modus'], ['Suction', 'Saugkraft'], ['Wetness', 'Wischfeuchte'], ['Passes', 'Durchgänge'], ['Route', 'Route'], ['CleanGenius', 'CleanGenius']];
  function dialogBlock(v) {
    if (!dialog) return '';
    var d = dialog, h = '<div class="dlg-back" data-dlg="close"><div class="dlg" role="dialog">';
    if (d.mode === 'plan') return h + planDialog(v, d) + '</div></div>';
    if (d.mode === 'hist' || d.mode === 'wear') {
      h += '<div class="dlg-head"><div><div class="dlg-title">' + (d.mode === 'hist' ? 'Verlauf' : 'Verschleiß') + '</div></div>' +
        '<button class="iconbtn" data-dlg="close" aria-label="Schließen">' + ic('close') + '</button></div>';
      if (d.mode === 'hist') v.history.forEach(function (l) { h += '<div class="hist">' + esc(l) + '</div>'; });
      else v.wear.forEach(function (w) {
        var lw = w.v <= v.wearWarn;
        h += '<div class="wear' + (lw ? ' low' : '') + '"><span>' + esc(w.name) + '</span><div class="bar"><i style="width:' + w.v + '%"></i></div>' +
          '<em>' + w.v + ' %</em><button class="iconbtn sm" data-reset="' + w.id + '" data-name="' + esc(w.name) + '" title="Zähler zurücksetzen">' + ic('reset') + '</button></div>';
      });
      return h + '</div></div>';
    }
    if (d.mode === 'autotime') {
      return h + '<div class="dlg-head"><div><div class="dlg-title">Uhrzeit der Automatik</div><div class="small mute">Startet einmal am Tag – auch wenn jemand zu Hause ist. Verpasste Starts werden bis zu 3 Stunden nachgeholt.</div></div>' +
        '<button class="iconbtn" data-dlg="close" aria-label="Schließen">' + ic('close') + '</button></div>' +
        '<input class="timein" type="time" id="autotime" value="' + esc(v.autoTime) + '">' +
        '<div class="chips tquick">' + ['07:00', '09:00', '10:00', '13:00', '15:00'].map(function (q) { return '<button class="chip' + (q === v.autoTime ? ' on' : '') + '" data-tq="' + q + '">' + q + '</button>'; }).join('') + '</div>' +
        '<div class="dlg-actions"><button class="btn main" data-tsave="1">' + ic('check') + 'Übernehmen</button></div></div></div>';
    }
    if (d.mode === 'autoprog' || d.mode === 'progsel') return h + progDialog(v, d) + '</div></div>';
    var sub = d.mode === 'presets' ? 'Gilt für „Alles reinigen“ und als Vorschlag beim Reinigen von Räumen.'
      : d.mode === 'prog' ? (d.target ? 'Für ' + d.target : 'Für die ganze Etage') + ' – Einstellungen lassen sich hier noch anpassen.' : 'Wie soll gereinigt werden?';
    h += '<div class="dlg-head"><div><div class="dlg-title">' + esc(d.name) + '</div><div class="small mute">' + sub + '</div></div>' +
      '<button class="iconbtn" data-dlg="close" aria-label="Schließen">' + ic('close') + '</button></div>';
    DLG.forEach(function (f) {
      var k = f[0];
      // Wischfeuchte beim reinen Saugen und Saugkraft beim reinen Wischen ausblenden
      if ((k === 'Wetness' && d.vals.Mode === 0) || (k === 'Suction' && d.vals.Mode === 1)) return;
      h += '<div class="field"><div class="flabel">' + f[1] + '</div>' + segSet(k, v.presets[k], d.vals[k], 'data-dlgset') + '</div>';
    });
    if (d.mode === 'presets') {
      h += '<div class="dlg-actions"><button class="btn main" data-dlg="save">' + ic('check') + 'Übernehmen</button></div></div></div>';
    } else {
      h += '<div class="dlg-actions"><button class="btn main" data-dlg="go">' + ic('play') + (v.job ? 'Nach der laufenden Fahrt' : (d.mode === 'prog' ? 'Jetzt starten' : 'Jetzt reinigen')) + '</button>' +
        (d.mode === 'room' ? '<button class="btn ghost" data-dlg="select">' + (d.sel ? 'Aus Auswahl entfernen' : 'Nur auswählen') + '</button>' : '') + '</div></div></div>';
    }
    return h;
  }

  // Farbe der Felder über dem Hintergrundbild – hier ausgerechnet statt per CSS-Farbmischung,
  // damit es auch in älteren Browser-Engines (Handy-App) funktioniert
  var cardOp = 0.62, darkMq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function applyGlass() {
    var dark = !darkMq || darkMq.matches, st = document.body.style;
    st.setProperty('--cardbg', (dark ? 'rgba(32,37,45,' : 'rgba(255,255,255,') + cardOp + ')');
    var sh = Math.max(0, (1 - cardOp) * 0.8).toFixed(2);
    st.setProperty('--tshadow', cardOp < 0.5 ? '0 1px 3px rgba(' + (dark ? '0,0,0,' : '255,255,255,') + sh + ')' : 'none');
  }
  if (darkMq && darkMq.addListener) darkMq.addListener(applyGlass);

  // Kurze Rückmeldung unten in der Kachel (kind: info | ok | err)
  function flash(t, kind, ms) {
    var f = document.getElementById('flash');
    if (!f) { f = document.createElement('div'); f.id = 'flash'; document.body.appendChild(f); }
    f.innerHTML = (kind === 'ok' ? ic('check') : kind === 'err' ? ic('alert') : kind === 'wait' ? '<span class="spin"></span>' : '') + '<span>' + esc(t) + '</span>';
    f.className = 'show ' + (kind || '');
    clearTimeout(flash.t); flash.t = setTimeout(function () { f.className = kind || ''; }, ms || 1800);
  }

  function openDialog(code) {
    var r = view.rooms.filter(function (x) { return x.code === code; })[0];
    if (!r) return;
    var vals = {};
    DLG.forEach(function (f) { vals[f[0]] = view.presets[f[0]].v; });
    var cp = view.programs[view.cleanProgram];
    if (cp) DLG.forEach(function (f) { if (cp.set[f[0]] !== undefined) vals[f[0]] = cp.set[f[0]]; });
    dialog = { mode: 'room', code: code, name: r.name, sel: r.sel, vals: vals };
    render();
  }
  function openDialogFor(mode) {
    var vals = {};
    DLG.forEach(function (f) { vals[f[0]] = view.presets[f[0]].v; });
    var names = view.rooms.filter(function (r) { return r.sel; }).map(function (r) { return r.name; });
    dialog = { mode: mode, name: mode === 'presets' ? 'Vorwahlen' : names.join(', '), vals: vals };
    render();
  }
  // Kurzfassung der Vorwahlen für die Raumkarte
  function presetSummary(v) {
    var out = [];
    ['Mode', 'Suction', 'Wetness', 'Passes'].forEach(function (k) {
      var p = v.presets[k];
      if (k === 'Wetness' && p.v !== -1 && v.presets.Mode.v === 0) return;
      if (k === 'Suction' && p.v !== -1 && v.presets.Mode.v === 1) return;
      if (p.v === -1 || (k === 'Passes' && p.v === 1)) return;
      p.o.forEach(function (o) { if (o[0] === p.v) out.push(SHORT[o[1]] || o[1]); });
    });
    return out.length ? out.join(' · ') : 'wie am Gerät';
  }

  // ---- Steuerleiste: großer Hauptknopf, daneben runde Knöpfe ----
  function controls(v) {
    var pend = function (c) { return isBusy('c' + c) ? ' pending' : ''; };
    var main = function (cmd, icon, label) {
      return '<button class="btn main big' + pend(cmd) + '" data-cmd="' + cmd + '">' + ic(icon) + label + '</button>';
    };
    var round = function (cmd, icon, label) {
      return '<button class="round' + pend(cmd) + '" data-cmd="' + cmd + '" title="' + label + '">' + ic(icon) + '<span>' + label + '</span></button>';
    };
    var h = '<div class="controls">';
    if (v.group === 'working' || v.group === 'moving') h += main(2, 'pause', 'Pause') + round(4, 'stop', 'Stopp') + round(5, 'home', 'Station');
    else if (v.group === 'paused') h += main(3, 'play', 'Fortsetzen') + round(4, 'stop', 'Stopp') + round(5, 'home', 'Station');
    else {
      var sel = v.rooms.filter(function (r) { return r.sel; }).map(function (r) { return r.name; });
      var what = sel.length ? (sel.length > 2 ? sel.length + ' Räume' : sel.join(' + ')) + ' reinigen' : 'Alles reinigen';
      h += '<button class="btn main big start' + (isBusy('start') ? ' pending' : '') + '" data-start="1">' + ic('play') +
        '<span class="st"><b>' + esc(what) + '</b><small>' + esc(v.programNames[v.cleanProgram] || '') + '</small></span></button>' +
        round(5, 'home', 'Station') + round(15, 'locate', 'Orten');
    }
    return h + '</div>';
  }

  function stat(label, value) {
    return '<div class="stat"><div class="sv">' + value + '</div><div class="sl">' + label + '</div></div>';
  }

  function render() {
    var v = view, el = document.getElementById('app');
    if (v && v.bgDim !== undefined) document.body.style.setProperty('--dim', v.bgDim / 100);
    if (v && v.bgBlur !== undefined) document.body.style.setProperty('--blur', v.bgBlur + 'px');
    if (v && v.cardOpacity !== undefined) { cardOp = v.cardOpacity / 100; applyGlass(); }
    if (v && v.cardGlass !== undefined) document.body.style.setProperty('--glass', v.cardGlass + 'px');
    if (!v) { el.innerHTML = '<div class="loading"><span></span>Verbinde …</div>'; return; }
    var h = '';

    // Kopf
    var tone = statusTone(v);
    h += '<header class="head"><div class="avatar ' + tone + '">' + robotSvg('av') + '</div><div class="hl grow"><div class="name">' + esc(v.name) +
      (v.live === true ? '<span class="live" title="Live-Verbindung aktiv – Karte und Zustand in Echtzeit"><i></i>LIVE</span>' : '') + '</div>' +
      '<div class="state"><span class="dot ' + tone + '"></span>' + esc(v.stateText) + '</div>' +
      (!v.online ? '<div class="small mute">keine Verbindung zum Roboter</div>' : '') +
      '</div>' + battery(v.battery, v.charging) + '</header>';

    // Zwei Spalten auf breiten Kacheln: links Karte und Bedienung, rechts der Rest
    h += '<div class="cols"><div class="col">';

    // Laufende Reinigung
    if (v.job) {
      h += '<div class="card jobcard">';
      if (v.progress !== null) h += '<div class="prog"><div class="bar"><i style="width:' + v.progress + '%"></i></div><b>' + v.progress + ' %</b></div>';
      h += '<div class="stats">' + stat('Raum', v.room && v.room !== '–' ? esc(v.room) : '–') + stat('Fläche', v.area + '<small> m²</small>') +
        stat('Dauer', v.time + '<small> min</small>') + '</div></div>';
    }

    if (v.error) {
      h += '<div class="alert ' + (v.warning ? 'warn' : 'bad') + '">' + ic('alert') + '<div class="grow"><b>' + esc(v.errorText) + '</b>' +
        (v.errorHint ? '<div class="small">' + esc(v.errorHint) + '</div>' : '') + '</div>' +
        (v.clearable ? '<button class="btn sm' + (isBusy('c14') ? ' pending' : '') + '" data-cmd="14">Quittieren</button>' : '') + '</div>';
    }

    h += mapBlock(v);
    h += controls(v);
    // Station kompakt: Zustand als kleine Anzeigen, Aktionen in einer Zeile
    var sIcon = ['drop', 'dirty', 'bag'], sShort = ['Frischwasser', 'Schmutzwasser', 'Beutel'];
    h += '<div class="card"><div class="ch"><span>Station</span></div><div class="spills">';
    v.station.forEach(function (s, i) {
      var st = s[1] < 0 ? 'unk' : (s[1] > 0 ? 'warn' : 'ok');
      h += '<span class="spill ' + st + '" title="' + esc(s[0]) + '">' + ic(sIcon[i] || 'drop', 'xs') + '<span>' + esc(sShort[i] || s[0]) + '</span><b>' + esc(s[2]) + '</b></span>';
    });
    h += '</div><div class="sacts">' +
      '<button class="sact' + (isBusy('c10') ? ' pending' : '') + '" data-cmd="10">' + ic('wash', 'xs') + 'Waschen</button>' +
      '<button class="sact' + (isBusy('c11') ? ' pending' : '') + '" data-cmd="11">' + ic('dry', 'xs') + 'Trocknen</button>' +
      '<button class="sact' + (isBusy('c13') ? ' pending' : '') + '" data-cmd="13">' + ic('empty', 'xs') + 'Absaugen</button></div></div>';

    h += '</div><div class="col">';

    // Reinigen: Räume wählen (optional) und Programm – gestartet wird über den großen Knopf
    var any = v.rooms.some(function (r) { return r.sel; });
    h += '<div class="card"><div class="ch"><span>Reinigen</span>' + (any ? '<button class="link" data-cmd="8">Auswahl leeren</button>' : '<span class="small mute">Räume antippen oder alles</span>') + '</div>';
    if (v.rooms.length) {
      h += '<div class="chips">';
      v.rooms.forEach(function (r) {
        h += '<button class="chip' + (r.sel ? ' on' : '') + (isBusy('r' + r.code) ? ' pending' : '') + '" data-room="' + r.code + '">' +
          (r.sel ? ic('check', 'xs') : '') + esc(r.name) + '</button>';
      });
      h += '</div>';
    }
    var cp = v.programs[v.cleanProgram] || v.programs[0];
    h += '<button class="setrow" data-open="progsel">' + ic(PICON[cp.id] || 'tune', 'lead') + '<span class="grow"><span class="small mute">Programm</span><br>' +
      esc(cp.name) + ' <span class="mute small">· ' + esc(setSummary(v, cp.set)) + '</span></span><span class="chev r"></span></button>';
    if (any && v.job) h += '<button class="btn main full' + (isBusy('start') ? ' pending' : '') + '" data-start="1">' + ic('play') + 'Danach reinigen</button>';
    if (v.queue && v.queue !== '–') h += '<div class="queue">' + ic('list', 'xs') + '<span class="grow">Vorgemerkt: ' + esc(v.queue) + '</span><button class="iconbtn sm" data-cmd="9" title="Vormerkung verwerfen">' + ic('close') + '</button></div>';
    // Verlauf und Verschleiß als Zeilen, Details im Untermenü
    var lowN = v.wear.filter(function (w) { return w.v <= v.wearWarn; }).length;
    h += '<div class="rows">' +
      (v.history.length ? '<button class="lrow" data-open="hist"><span class="lk">Verlauf</span><span class="lv">' + esc(v.history[0]) + '</span><span class="chev r"></span></button>' : '') +
      (v.wear.length ? '<button class="lrow" data-open="wear"><span class="lk">Verschleiß</span><span class="lv">' + (lowN ? '<span class="badge warn">' + lowN + ' fällig</span>' : 'alles in Ordnung') + '</span><span class="chev r"></span></button>' : '') +
      '</div></div>';

    if (v.maintenance && v.maintenance !== '–') h += '<div class="alert warn">' + ic('wrench') + '<div class="grow"><b>Wartung fällig</b><div class="small">' + esc(v.maintenance) + '</div></div></div>';

    // Automatik, kompakt: Schalter, wann sie startet, Programm, Raumplan
    var ap = v.programs[v.autoProgram] || v.programs[0];
    var astat = v.autoMode === 0 && !v.hasPresence ? 'Anwesenheitsvariable in der Instanz wählen' : v.autoStatus;
    h += '<div class="card"><div class="row between"><div class="row">' + ic('auto', 'lead') + '<div><div class="ctitle">Automatik</div><div class="small mute">' + esc(astat) + '</div></div></div>' +
      (v.autoMode === 1 || v.hasPresence ? '<button class="switch' + (v.auto ? ' on' : '') + '" data-auto="' + (v.auto ? 0 : 1) + '" aria-label="Automatik"></button>' : '') + '</div>' +
      '<div class="seg full amode"><button class="' + (v.autoMode === 0 ? 'on' : '') + '" data-amode="0">Bei Abwesenheit</button>' +
      '<button class="' + (v.autoMode === 1 ? 'on' : '') + '" data-amode="1">Zur Uhrzeit</button></div><div class="rows">' +
      (v.autoMode === 1 ? '<button class="lrow" data-open="autotime"><span class="lk">Uhrzeit</span><span class="lv">' + esc(v.autoTime) + ' Uhr <span class="mute small">Standard</span></span><span class="chev r"></span></button>' : '') +
      '<button class="lrow" data-open="autoprog"><span class="lk">Programm</span><span class="lv">' + esc(ap.name) + '</span><span class="chev r"></span></button>' +
      '<button class="lrow" data-open="plan"><span class="lk">Zeitpläne</span><span class="lv">' + esc(planShort(v)) + '</span><span class="chev r"></span></button></div>' +
      (v.auto && v.autoMode === 1 && v.autoToday ? '<div class="small mute" style="margin-top:6px">' + esc(v.autoToday) + '</div>' : '') + '</div>';

    if (v.message) h += '<div class="msg">' + esc(v.message) + '</div>';
    h += '</div></div>';
    h += dialogBlock(v);
    el.innerHTML = h;
    placeLabels();
    var mi = document.getElementById('mapimg');
    if (mi && !mi.complete) mi.onload = placeLabels;
    // Roboter gleitet von der alten zur neuen Position
    var rb = document.getElementById('robot');
    if (rb) requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        rb.style.left = rb.dataset.x + '%'; rb.style.top = rb.dataset.y + '%';
        rb.style.transform = 'translate(-50%,-50%) rotate(' + rb.dataset.a + 'deg)';
      });
    });
  }

  document.addEventListener('click', function (e) {
    if (e.target.id === 'mapimg' || (e.target.closest && e.target.closest('.lbl, .robot, .dock')) || (e.target.classList && e.target.classList.contains('mapwrap'))) {
      if (showLast || !view) return;
      var code = roomAt(e, view.mapMeta);
      if (code && view.rooms.some(function (r) { return r.code === code; })) openDialog(code);
      else flash(view.mapMeta ? 'Kein Raum an dieser Stelle' : 'Karte wird noch vorbereitet');
      return;
    }
    // Segmentschalter in der Nachfrage
    var ds = e.target.closest('[data-dlgset]');
    if (ds && dialog) { dialog.vals[ds.dataset.dlgset] = parseInt(ds.dataset.val, 10); render(); return; }
    if (dialog && dialog.mode === 'plan') {
      var pb = e.target.closest('[data-proom],[data-poff],[data-pdel],[data-padd],[data-psave]');
      if (pb) {
        var rows = dialog.rows;
        if (pb.dataset.proom) { var pr2 = pb.dataset.proom.split(':'), row = rows[+pr2[0]]; if (!row.off) row['r' + pr2[1]] = !row['r' + pr2[1]]; }
        else if (pb.dataset.poff) { var ro = rows[+pb.dataset.poff]; ro.off = !ro.off; }
        else if (pb.dataset.pdel) rows.splice(+pb.dataset.pdel, 1);
        else if (pb.dataset.padd) rows.push({ day: 8, time: '', prog: -1, off: false });
        else if (pb.dataset.psave) { var out = rows; dialog = null; act('TilePlan', JSON.stringify(out), 'plan'); flash('Wird gespeichert …', 'wait', 30000); return; }
        render(); return;
      }
    }
    // Zähler zurücksetzen (im Verschleiß-Dialog)
    var rs = e.target.closest('[data-reset]');
    if (rs) {
      if (typeof confirm !== 'function' || confirm(rs.dataset.name + ': Zähler zurücksetzen?')) act('TileReset', rs.dataset.reset);
      return;
    }
    // Uhrzeit-Dialog
    var tb = e.target.closest('[data-tq],[data-tsave]');
    if (tb && dialog && dialog.mode === 'autotime') {
      if (tb.dataset.tq) {
        var ti = document.getElementById('autotime'); if (ti) ti.value = tb.dataset.tq;
        Array.prototype.forEach.call(document.querySelectorAll('[data-tq]'), function (c) { c.classList.toggle('on', c === tb); });
      } else { var tv = (document.getElementById('autotime') || {}).value; dialog = null; if (tv) act('AutoTime', tv); else render(); }
      return;
    }
    var pk = e.target.closest('[data-pick]');
    if (pk && dialog) {
      var which = dialog.mode === 'autoprog' ? 'AutoProgram' : 'CleanProgram';
      dialog = null; act(which, parseInt(pk.dataset.pick, 10)); return;
    }
    var dl = e.target.closest('[data-dlg]');
    if (dl && dialog) {
      var a = dl.dataset.dlg;
      if (a === 'close' && dl.classList.contains('dlg-back') && e.target !== dl) return;   // Klick im Dialog selbst schließt nicht
      var d = dialog;
      dialog = null;
      if (a === 'go' && d.mode === 'prog') { act('TileProgram', JSON.stringify(d.vals), 'prog'); flash('Wird gesendet …', 'wait', 30000); }
      else if (a === 'go' && d.mode === 'sel') { act('TileCleanSel', JSON.stringify(d.vals), 'sel'); flash('Wird gesendet …', 'wait', 30000); }
      else if (a === 'go') { act('TileClean', JSON.stringify(Object.assign({ code: d.code }, d.vals)), 'r' + d.code); flash('Wird gesendet …', 'wait', 30000); }
      else if (a === 'save') {
        Object.keys(d.vals).forEach(function (k) { if (d.vals[k] !== view.presets[k].v) requestAction(k, d.vals[k]); });
        flash('Vorwahlen übernommen', 'ok'); render();
      }
      else if (a === 'select') act('TileRoom', d.code, 'r' + d.code);
      else render();
      return;
    }
    var t = e.target.closest('button');
    if (t && t.dataset.view) { showLast = t.dataset.view === 'last'; render(); return; }
    if (!t || t.disabled) return;
    if (['autoprog', 'progsel', 'autotime', 'hist', 'wear'].indexOf(t.dataset.open) >= 0) { dialog = { mode: t.dataset.open }; render(); return; }
    if (t.dataset.start) { act('TileStart', 1, 'start'); flash('Wird gesendet …', 'wait', 30000); return; }
    if (t.dataset.amode) { act('AutoMode', parseInt(t.dataset.amode, 10)); return; }
    if (t.dataset.open === 'plan') { dialog = { mode: 'plan', rows: JSON.parse(JSON.stringify(view.plan)) }; render(); return; }
    if (t.dataset.prog) {
      var pr = view.programs.filter(function (p) { return p.id === parseInt(t.dataset.prog, 10); })[0];
      if (!pr) return;
      var names = view.rooms.filter(function (r) { return r.sel; }).map(function (r) { return r.name; });
      dialog = { mode: 'prog', name: pr.name, target: names.join(', '), vals: JSON.parse(JSON.stringify(pr.set)) };
      render(); return;
    }
    if (t.dataset.open) { openDialogFor(t.dataset.open); return; }
    if (t.dataset.cmd) { act('Command', parseInt(t.dataset.cmd, 10), 'c' + t.dataset.cmd); if (['8', '9'].indexOf(t.dataset.cmd) < 0) flash('Wird gesendet …', 'wait', 30000); }
    else if (t.dataset.floor) act('Floor', parseInt(t.dataset.floor, 10));
    else if (t.dataset.room) act('TileRoom', parseInt(t.dataset.room, 10), 'r' + t.dataset.room);
    else if (t.dataset.auto) act('AutoAway', t.dataset.auto === '1');
    else if (t.dataset.reset) {
      if (typeof confirm !== 'function' || confirm(t.dataset.name + ': Zähler zurücksetzen?')) act('TileReset', t.dataset.reset);
    }
  });
  // Auswahlfelder im Raumplan-Dialog
  document.addEventListener('change', function (e) {
    if (!dialog || dialog.mode !== 'plan') return;
    var t = e.target;
    if (t.dataset.pday !== undefined) dialog.rows[+t.dataset.pday].day = parseInt(t.value, 10);
    else if (t.dataset.pprog !== undefined) dialog.rows[+t.dataset.pprog].prog = parseInt(t.value, 10);
    else if (t.dataset.ptime !== undefined) { dialog.rows[+t.dataset.ptime].time = t.value || ''; return; }
    else return;
    render();
  });
  document.addEventListener('toggle', function (e) {
    if (e.target.dataset && e.target.dataset.k) open[e.target.dataset.k] = e.target.open;
  }, true);

  // Pflichtfunktion des HTML-SDK
  window.handleMessage = function (data) {
    var d = typeof data === 'string' ? JSON.parse(data) : data;
    if ('bg' in d) {
      var bg = document.getElementById('bg');
      bg.style.backgroundImage = d.bg ? 'url("' + d.bg + '")' : '';
      document.body.classList.toggle('hasbg', !!d.bg);
    }
    if (d.map) map = d.map;
    if (d.mapLast) mapLast = d.mapLast;
    if (d.view) {
      view = d.view; busy = {};
      // Rückmeldung des Moduls (gesendet / fehlgeschlagen) einblenden, aber nur frische
      var t = view.toast;
      if (t && t.id !== lastToast) {
        if (lastToast !== null || t.age < 8) { render(); flash(t.text, t.kind, t.kind === 'err' ? 6000 : 3200); lastToast = t.id; return; }
      }
      if (t) lastToast = t.id;
      else if (lastToast === null) lastToast = '';
    }
    render();
  };

  window.handleMessage("__INIT__");
})();
</script>
